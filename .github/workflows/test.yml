name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check i18n dictionaries
        run: node tools/check_i18n.js

      - name: Install AutoHotkey v2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo AutoHotkey/AutoHotkey --pattern "AutoHotkey_2.*.zip" --dir "$env:TEMP"
          $zip = Get-ChildItem "$env:TEMP\AutoHotkey_2.*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:TEMP\ahk-v2" -Force
          $ahkExe = Get-ChildItem "$env:TEMP\ahk-v2" -Filter "AutoHotkey64.exe" -Recurse | Select-Object -First 1
          if (-not $ahkExe) { throw "AutoHotkey64.exe not found in archive" }
          echo $ahkExe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate main script syntax
        shell: pwsh
        run: |
          $p = Start-Process "AutoHotkey64.exe" -ArgumentList '/validate', '/ErrorStdOut', 'WindowAssist.ahk' -Wait -PassThru -NoNewWindow
          exit $p.ExitCode

      - name: Check generated web defaults
        shell: pwsh
        run: |
          $p = Start-Process "AutoHotkey64.exe" -ArgumentList '/ErrorStdOut', 'tools\gen_defaults.ahk', 'check' -Wait -PassThru -NoNewWindow
          exit $p.ExitCode

      - name: Run unit tests
        shell: pwsh
        run: |
          $p = Start-Process "AutoHotkey64.exe" -ArgumentList '/ErrorStdOut', 'tests\run.ahk' -Wait -PassThru -NoNewWindow
          Get-Content tests\last-run.txt
          exit $p.ExitCode
